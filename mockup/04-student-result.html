<!doctype html><html lang="ko"><head><meta charset="utf-8">
<title>학생 화면 — 결과</title><link rel="stylesheet" href="ui.css"></head>
<body>
<div class="hd">
  <span class="logo">🏝 보물섬 점령전</span>
  <span class="sub">학생 화면</span>
</div>

<div class="wrap stu" style="flex-direction:column">
  <div class="me-bar" style="width:100%">
    <span class="tag h">홍팀</span>
    <b style="font-size:15px">박민수</b>
    <span style="font-size:12px;color:#7b8892">내 위치 D7 · 맞힌 문제 5</span>
    <span style="margin-left:auto;font-size:13px">
      <b style="color:#e05a4f">홍 21</b>
      <span style="color:#c3ccd2;margin:0 6px">:</span>
      <b style="color:#2f9e44">청 16</b>
    </span>
    <span style="font-size:13px;color:#7b8892;margin-left:14px">남은 시간 <b style="color:#e03131;font-size:17px">00:24</b></span>
  </div>

  <div class="quiz" style="width:100%">
    <div class="result">
      <div class="big ok">정답! 🎉</div>
      <div class="msg"><b>D7</b> 은 <b style="color:#c8871a">📦 보물 칸</b> 이었어요!</div>
    </div>

    <div style="text-align:center">
      <div class="gain">
        <div>이번에 얻은 점수<b style="color:#2fbf71">+3</b></div>
        <div>우리 팀 점수<b style="color:#e05a4f">21</b></div>
        <div>내가 맞힌 문제<b>5</b></div>
      </div>
    </div>

    <div style="margin-top:18px">
      <div class="qhead"><span class="cellname">D7</span><span>이 문제의 정답</span></div>
      <div class="qtext" style="font-size:17px">조선 시대에 훈민정음을 창제한 임금은 누구인가요?</div>
      <div class="opts">
        <div class="opt"><span class="num">1</span>태조</div>
        <div class="opt right"><span class="num">2</span>세종대왕 &nbsp;✓</div>
        <div class="opt"><span class="num">3</span>정조</div>
        <div class="opt"><span class="num">4</span>영조</div>
      </div>
    </div>

    <div style="text-align:center;font-size:12.5px;color:#96a1aa;margin-top:17px">
      3초 뒤에 지도로 돌아갑니다 · 이 문제는 다시 볼 수 없어요
    </div>
  </div>
</div>
</body></html>
