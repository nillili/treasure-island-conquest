<!doctype html><html lang="ko"><head><meta charset="utf-8">
<title>학생 화면 — 문제 풀이</title><link rel="stylesheet" href="ui.css"></head>
<body>
<div class="hd">
  <span class="logo">🏝 보물섬 점령전</span>
  <span class="sub">학생 화면</span>
</div>

<div class="wrap stu" style="flex-direction:column">
  <div class="me-bar" style="width:100%">
    <span class="tag h">홍팀</span>
    <b style="font-size:15px">박민수</b>
    <span style="font-size:12px;color:#7b8892">D7 공략 중</span>
    <span style="margin-left:auto;font-size:13px">
      <b style="color:#e05a4f">홍 18</b>
      <span style="color:#c3ccd2;margin:0 6px">:</span>
      <b style="color:#2f9e44">청 16</b>
    </span>
    <span style="font-size:13px;color:#7b8892;margin-left:14px">남은 시간 <b style="color:#e03131;font-size:17px">00:31</b></span>
  </div>

  <div class="quiz" style="width:100%">
    <div class="qhead">
      <span class="cellname">D7</span>
      <span>이 칸을 공략하는 중입니다</span>
      <span style="margin-left:auto">문제를 맞히면 이 칸이 <b style="color:#e05a4f">홍팀</b> 땅이 됩니다</span>
    </div>
    <div class="qtext">조선 시대에 훈민정음을 창제한 임금은 누구인가요?</div>
    <div class="opts">
      <div class="opt"><span class="num">1</span>태조</div>
      <div class="opt"><span class="num">2</span>세종대왕</div>
      <div class="opt"><span class="num">3</span>정조</div>
      <div class="opt"><span class="num">4</span>영조</div>
    </div>
    <div class="bar"><i style="width:52%"></i></div>
    <div style="display:flex;font-size:11.5px;color:#96a1aa;margin-top:6px">
      <span>답을 고르면 바로 채점됩니다</span>
      <span style="margin-left:auto">이 칸의 종류는 맞힌 뒤에 알 수 있어요</span>
    </div>
  </div>

  <div class="card" style="width:100%;margin-top:11px;background:#eef7f1;border-left:4px solid #2fbf71">
    <div style="font-size:12px;color:#3c5a49;line-height:1.6">
      💡 시간이 남으면 계속 다음 칸에 도전할 수 있어요. 빨리 풀수록 더 많은 땅을 차지합니다.
    </div>
  </div>
</div>
</body></html>
