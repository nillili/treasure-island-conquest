<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>3D 무대 확인 · 보물섬 점령전</title>
<!--
  백엔드가 필요 없는 확인용 페이지다. 두 가지를 여기서 정한다.
   ① 그림 8장이 같은 캐릭터인가 (맨 아래 격자)
   ② 차례인 팀에 깔리는 빛의 색·진하기 (위쪽 조절판)
  [CSS 복사]로 뽑은 값을 style.css 의 :root 에 그대로 붙이면 끝난다.
-->
<link rel="stylesheet" href="/style.css">
<style>
  body{background:url('/assets/treasure-island-bg.png') center/cover fixed no-repeat,#348fc0;margin:0}
  .tools{position:sticky;top:0;z-index:9;display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center;
    padding:10px 14px;background:#12384fe8;color:#fff;font:13px "Noto Sans KR",sans-serif;
    backdrop-filter:blur(4px)}
  .tools label{display:flex;gap:6px;align-items:center;white-space:nowrap}
  .tools input[type=range]{width:96px}
  .tools b{min-width:34px;display:inline-block;text-align:right;font-variant-numeric:tabular-nums}
  .frame{margin:16px auto;background:#fffdf5ec;border-radius:13px;padding:13px;
    box-shadow:0 5px 18px #163b5855}
  .fakeboard{width:609px;height:609px;border-radius:6px;background:
    repeating-linear-gradient(45deg,#f5d9a0 0 14px,#eccf94 14px 28px);border:1px solid #d7b477;
    display:grid;place-items:center;color:#8a7748;font:700 14px "Noto Sans KR",sans-serif}
  pre{margin:16px;padding:12px;background:#12384fee;color:#9fe8ff;border-radius:10px;
    font-size:12.5px;line-height:1.6;overflow:auto}
  h3.sec{color:#fff;margin:22px 16px 8px;text-shadow:0 2px 8px #0b2f45}
  .grid{display:flex;flex-wrap:wrap;gap:14px;padding:0 16px 30px}
  .grid figure{margin:0;text-align:center;font-weight:800;font-size:12px}
  .grid figcaption{background:#12384fdd;color:#fff;border-radius:8px;padding:3px 8px;display:inline-block;margin-top:4px}
  .grid img{width:210px;display:block;filter:drop-shadow(0 10px 14px #12384f55)}
</style>
</head>
<body>

<div class="tools">
  <label>홍 <input type="color" id="cH" value="#e05a4f"></label>
  <label>청 <input type="color" id="cC" value="#2f9e44"></label>
  <label>빛 진하기 <input type="range" id="alpha" min="0" max="70" value="49"><b id="vAlpha"></b></label>
  <label>빛 퍼짐 <input type="range" id="size" min="40" max="100" value="73"><b id="vSize"></b></label>
  <label>발밑 <input type="range" id="glow" min="0" max="100" value="100"><b id="vGlow"></b></label>
  <label>발밑 높이 <input type="range" id="glowY" min="10" max="45" value="36"><b id="vGlowY"></b></label>
  <label>반대쪽 채도 <input type="range" id="rest" min="0" max="100" value="35"><b id="vRest"></b></label>
  <label>폭풍 크기 <input type="range" id="sStorm" min="90" max="140" value="100"><b id="vStorm"></b></label>
  <label>화면폭
    <select id="width">
      <option>1100</option><option>1366</option><option>1600</option><option selected>1920</option>
    </select>
  </label>
  <button class="button muted" id="swap">좌우 바꾸기</button>
  <button class="button primary" id="copy">CSS 복사</button>
  <button class="button muted" id="reset">되돌리기</button>
</div>

<div class="frame" id="frame">
  <div class="board-stage wide">
    <div class="fx turn" data-team="H" id="sH"></div>
    <div class="board-wrap"><div class="fakeboard">보드 (12×12 · 609px)</div></div>
    <div class="fx" data-team="C" id="sC"></div>
  </div>
</div>

<pre id="out"></pre>

<h3 class="sec">그림 8장 — 얼굴 · 모자 · 옷 · 배낭 · 크기를 대조한다</h3>
<div class="grid" id="all"></div>

<script>
const $ = (id) => document.getElementById(id);
const KEY = "fx-tune";
const FIELDS = ["cH", "cC", "alpha", "size", "glow", "glowY", "rest", "sStorm", "width"];
// style.css 의 :root 와 같은 값이어야 한다. 여기서 정한 것을 그쪽에 옮겨 적었다(2026-08-10).
const DEFAULT = { cH: "#e05a4f", cC: "#2f9e44", alpha: 49, size: 73, glow: 100, glowY: 36, rest: 35, sStorm: 100, width: "1920" };
const rgb = (hex) => [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16)).join(" ");
const bust = Date.now(); // 그림을 고쳐 넣고 새로고침하면 바로 보이게

function card(kind, team, title, names, cls) {
  return `<div class="fx-card on ${cls || ""}" data-kind="${kind}">
    <img src="/assets/fx/${kind}-${team}.webp?t=${bust}"
         onerror="this.outerHTML='<div class=\\'fx-fallback\\'>❓</div>'">
    <div class="fx-title${cls === "searching" ? " fx-lead" : ""}">${title}</div>
    ${names ? `<div class="fx-names">${names}</div>` : ""}</div>`;
}

let flip = false;
let rotate = 0;

function paint() {
  const v = Object.fromEntries(FIELDS.map((f) => [f, $(f).value]));
  const r = document.documentElement.style;
  r.setProperty("--fx-tint-H", rgb(v.cH));
  r.setProperty("--fx-tint-C", rgb(v.cC));
  r.setProperty("--fx-tint-alpha", (v.alpha / 100).toFixed(2));
  r.setProperty("--fx-tint-size", v.size + "%");
  r.setProperty("--fx-glow", (v.glow / 100).toFixed(2));
  r.setProperty("--fx-glow-y", v.glowY + "%");
  r.setProperty("--fx-rest", (v.rest / 100).toFixed(2));
  r.setProperty("--fx-s-storm", (v.sStorm / 100).toFixed(2));
  $("vAlpha").textContent = (v.alpha / 100).toFixed(2);
  $("vSize").textContent = v.size + "%";
  $("vGlow").textContent = (v.glow / 100).toFixed(2);
  $("vGlowY").textContent = v.glowY + "%";
  $("vRest").textContent = (v.rest / 100).toFixed(2);
  $("vStorm").textContent = (v.sStorm / 100).toFixed(2);

  // 본문 폭 = 화면폭 − 사이드바 270 − 바깥 여백. 실제 화면과 같은 계산이다.
  $("frame").style.maxWidth = (Number(v.width) - 312) + "px";

  const turn = flip ? "C" : "H";
  const rest = flip ? "H" : "C";
  const nameTurn = turn === "H" ? "홍팀" : "청팀";
  $("s" + turn).className = "fx turn";
  $("s" + rest).className = "fx";
  $("s" + turn).innerHTML =
    card("search", turn, `▶ ${nameTurn} 수색 중`, "3명이 문제를 푸는 중", "searching")
    + `<div class="fx-clock">00:42</div>`;

  // 반대쪽에는 그 팀이 방금 끝낸 턴의 결과가 돌아간다
  const results = [
    ["treasure", "📦 보물을 열었다! +2", "민수 · 영희"],
    ["attack", "💥 상대 땅을 빼앗았다!", "철수"],
    ["storm", "⛈️ 폭풍에 갇혔다 — 다음 턴 쉼", "수경"],
  ];
  $("s" + rest).innerHTML = results
    .map(([k, t, n], i) => card(k, rest, t, n, "pop").replace("fx-card on", i === rotate % 3 ? "fx-card on" : "fx-card"))
    .join("")
    + `<div class="fx-dots">${results.map((_, i) => `<i class="${i === rotate % 3 ? "on" : ""}"></i>`).join("")}</div>`;

  $("out").textContent = `/* style.css 의 :root 에 이대로 붙인다 */
--fx-tint-H:${rgb(v.cH)};
--fx-tint-C:${rgb(v.cC)};
--fx-tint-alpha:${(v.alpha / 100).toFixed(2)};
--fx-tint-size:${v.size}%;
--fx-glow:${(v.glow / 100).toFixed(2)};\n--fx-glow-y:${v.glowY}%;
--fx-rest:${(v.rest / 100).toFixed(2)};
--fx-s-storm:${(v.sStorm / 100).toFixed(2)};`;
  localStorage.setItem(KEY, JSON.stringify(v));
}

for (const f of FIELDS) $(f).addEventListener("input", paint);
$("swap").onclick = () => { flip = !flip; paint(); };
$("copy").onclick = () => navigator.clipboard.writeText($("out").textContent).then(() => ($("copy").textContent = "복사됨"));
$("reset").onclick = () => { for (const [k, v] of Object.entries(DEFAULT)) $(k).value = v; paint(); };
setInterval(() => { rotate++; paint(); }, 2500);

try {
  const saved = JSON.parse(localStorage.getItem(KEY) || "{}");
  for (const [k, v] of Object.entries(saved)) if ($(k)) $(k).value = v;
} catch { /* 처음 열었다 */ }

$("all").innerHTML = ["H", "C"]
  .flatMap((t) => ["search", "treasure", "storm", "attack"]
    .map((k) => `<figure><img src="/assets/fx/${k}-${t}.webp?t=${bust}"><figcaption>${k}-${t}</figcaption></figure>`))
  .join("");
paint();
</script>
</body>
</html>
